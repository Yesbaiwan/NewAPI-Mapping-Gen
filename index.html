<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NewAPI Mapping Generator · 模型映射生成</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // 首屏防闪烁（完整换肤在 main.ts 里做）：
      // 存过主题 → 深色主题提前挂 dark；没存过 → 跟随系统深浅偏好。
      // 深色主题 id 列表需与 src/lib/themes.ts 保持一致。
      try {
        var stored = JSON.parse(localStorage.getItem('nmg_theme') || 'null');
        var dark = ['dark', 'gray', 'violet', 'amber'].includes(stored);
        if (stored === null)
          dark = matchMedia('(prefers-color-scheme: dark)').matches;
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
